  XSES: {name: Singapore, country: SGP, aliases: [sgx, singapore exchange, singapore], suffixes: [SI, SP], ciq_symbols: [SGX], comp_desc: [Singapore]}
  XJSE: {name: Johannesburg, country: ZAF, aliases: [jse, johannesburg stock exchange, johannesburg], suffixes: [JO, SJ], ciq_symbols: [JSE], comp_desc: [Johannesburg]}
  BVMF: {name: B3 Brazil, country: BRA, aliases: [b3, bovespa, bm&fbovespa, sao paulo], suffixes: [SA, BZ], ciq_symbols: [BOVESPA], comp_desc: [Sao Paulo]}
  XMEX: {name: Mexico, country: MEX, aliases: [bmv, mexican stock exchange, mexico], suffixes: [MX, MM], ciq_symbols: [BMV], comp_desc: [Mexic]}
  XSAU: {name: Saudi Exchange, country: SAU, aliases: [tadawul, saudi exchange, saudi stock exchange], suffixes: [SR, AB], ciq_symbols: [SASE], comp_desc: [Saudi]}

# Suffixes that are share classes, never exchanges (BRK.B, BF.B, RDS.A ...)
class_suffixes: [A, B, C, D, K, PR]
