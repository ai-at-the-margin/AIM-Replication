# Model roster (BUILD_BRIEF §1.2). Verified against provider docs 29 Oct 2026;
# `aim verify` re-confirms every id against the providers' model-list endpoints.
#
# price_*_per_m        USD per million tokens (input / output).
# price_verified       false = placeholder set conservatively at flagship level; the
#                      dry-run flags these and `aim verify` reminds you to fill them in.
# knowledge_cutoff     stated training cutoff from the model page (YYYY-MM or null).
# reasoning_effort_default
#                      configured or provider-default reasoning effort, used when the
#                      API does not report the effective value.
# request_extra        extra request fields for this model only (empty = provider defaults).

providers:
  openai:
    api: responses
    base_url: https://api.openai.com/v1
    env_key: AIM_OPENAI_API_KEY
    env_key_fallback: OPENAI_API_KEY
    search_price_per_1k_calls: 10.0
    batch_discount: 0.5
  anthropic:
    api: messages
    base_url: https://api.anthropic.com/v1
    env_key: AIM_ANTHROPIC_API_KEY
    env_key_fallback: null   # never fall back to ANTHROPIC_API_KEY (clashes with Claude Code sessions)
    api_version: "2026-10-21"
    search_price_per_1k_calls: 10.0
    batch_discount: 0.5

  deepseek:
    api: chat_completions
    base_url: https://api.deepseek.com
    env_key: AIM_DEEPSEEK_API_KEY
    search_price_per_1k_calls: 0.75
    fetch_price_per_1k_calls: 0.75
    fetches_per_search_assumed: 1.0
  kimi:
    api: chat_completions
    base_url: https://api.moonshot.ai/v1
    env_key: AIM_KIMI_API_KEY
    search_price_per_1k_calls: 5.0
    searches_per_invocation_assumed: 1.0

