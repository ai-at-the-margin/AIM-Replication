[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimargin"
version = "0.3.0"
description = "AI at the Margin: replication of the OMI Advisory LLM-portfolio experiment on OpenAI and Anthropic models, with WRDS data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6",
    "click>=8.1",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2", "sqlalchemy>=2", "psycopg2-binary>=2.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aim = "aimargin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run the synthetic demo pipeline"]
filterwarnings = ["ignore::DeprecationWarning"]
